[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rightsub"
version = "1.5.1"
description = "Universal Subtitle Mastering & Translation Suite for Movies & TV Series (Plex/Infuse BiDi & AI SubSwarm)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Omer Ninyo", email = "omer@ninyo.co" }
]
keywords = [
    "subtitles",
    "bidi",
    "plex",
    "infuse",
    "translation",
    "hebrew",
    "srt",
    "ffmpeg",
    "ollama",
    "quicksubs",
    "mcp"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
rightsub = "rightsub:main"

[tool.setuptools]
py-modules = ["rightsub", "toolkit"]
packages = ["scripts"]

[project.urls]
Homepage = "https://github.com/omerninyo/RightSub"
Repository = "https://github.com/omerninyo/RightSub.git"
Documentation = "https://github.com/omerninyo/RightSub/wiki"
