name: Sync Traffic Analytics

on:
  schedule:
    - cron: '0 0 * * *'  # ריצה יומית בחצות UTC
  workflow_dispatch:      # הפעלה ידנית לפי דרישה

jobs:
  sync-traffic:
    name: Archive Traffic & Update Report
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Traffic Sync Script
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          python scripts/sync_traffic_analytics.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/analytics/
          if git diff --staged --quiet; then
            echo "[*] No new traffic changes to commit."
          else
            git commit -m "chore(analytics): archive daily traffic statistics [skip ci]"
            git push
          fi
